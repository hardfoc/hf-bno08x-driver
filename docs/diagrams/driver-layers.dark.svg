<text x="829.7" y="409.5" font-size="16" font-weight="700" fill="#C7CBFF">RunDfuFromMemory</text>
<text x="48" y="307.4" font-size="17" font-weight="700" fill="#C7CBFF">HARDWARE-AGNOSTIC CORE</text>
<text x="326.2" y="307.4" font-size="16" fill="#C7CBFF">BNO085&lt;Comm&gt;, inc/bno08x.hpp</text>
<text x="56" y="510.4" font-size="20" font-weight="700" fill="#FDE68A">CEVA SH-2 and SHTP</text>
<text x="56" y="541" font-size="17" fill="#D2DAE4">src/sh2 submodule: sensor configuration,</text>
<text x="56" y="565.7" font-size="17" fill="#D2DAE4">report decoding, transport framing</text>
<text x="644" y="510.4" font-size="20" font-weight="700" fill="#C7CBFF">UART-RVC parser and DFU</text>
<text x="644" y="541" font-size="17" fill="#D2DAE4">in the core: 19-byte frames at 100 Hz;</text>
<text x="644" y="565.7" font-size="17" fill="#D2DAE4">bootloader transfer with CRC-16</text>
<text x="56" y="664.4" font-size="20" font-weight="700" fill="#C7CBFF">Communication interface</text>
<text x="56" y="695" font-size="17" fill="#D2DAE4">bno08x::CommInterface&lt;Derived&gt;: CRTP base, resolved at compile time, no vtable;</text>
<text x="56" y="719.7" font-size="17" fill="#D2DAE4">control pins by name (RSTN, BOOTN, WAKE, PS0, PS1) as ACTIVE / INACTIVE</text>
<text x="56" y="818.4" font-size="20" font-weight="700" fill="#A7F3E6">Platform port (your class)</text>
<text x="56" y="847.6" font-size="16" font-family="'JetBrains Mono', 'SFMono-Regular', Menlo, Consolas, monospace" fill="#D2DAE4">GetInterfaceType()  Open()  Close()  Write()  Read()  DataAvailable()  Delay()  GetTimeUs()  GpioSet()</text>
<text x="56" y="946.4" font-size="20" font-weight="700" fill="#E8EDF3">BNO080 / BNO085 / BNO086</text>
<text x="56" y="977" font-size="17" fill="#D2DAE4">I2C up to 400 kHz, SPI mode 3 up to 3 MHz, UART 3 Mbit/s or UART-RVC 115200  /  H_INTN, NRST, BOOTN</text>
<rect x="32" y="1012.8" width="14" height="14" rx="4" fill="#1C1F3D" stroke="#8C93FF" stroke-width="1.4"/>
